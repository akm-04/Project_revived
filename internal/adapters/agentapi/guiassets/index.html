<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GXB operator</title>
<link rel="stylesheet" href="/gui/app.css">
<script src="/gui/app.js" defer></script>
</head>
<body>
<main class="page">
<section id="login-view" class="card login">
<h1>GXB operator</h1>
<form id="login-form">
<label for="password">Root password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Log in</button>
</form>
<p id="login-status" class="status" role="status"></p>
<p class="hint">First start: set the password with <code>gxb-operator setup</code>.</p>
</section>

<section id="app-view" hidden>
<div class="toolbar">
<h1>GXB operator</h1>
<button id="logout-button" type="button" class="secondary">Log out</button>
</div>
<p id="backend-error" class="status" role="status"></p>
<nav id="tabs" class="tabs" aria-label="Modules"></nav>
<div id="module-view" class="module"></div>
</section>
</main>
</body>
</html>
