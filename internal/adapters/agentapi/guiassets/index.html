<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GXB operator</title>
<link rel="stylesheet" href="/gui/vendor/tabler-1.7.3/tabler.min.css">
<link rel="stylesheet" href="/gui/app.css">
<script src="/gui/vendor/tabler-1.7.3/tabler.min.js" defer></script>
<script type="module" src="/gui/app.js"></script>
</head>
<body>
<section id="login-view" class="login">
<div class="card card-md">
<div class="card-body">
<h1 class="card-title">GXB operator</h1>
<form id="login-form">
<label class="form-label" for="password">Root password</label>
<input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
<button type="submit" class="btn btn-primary w-100 mt-3">Log in</button>
</form>
<p id="login-status" class="status mt-2" role="status"></p>
<p class="hint">First start: set the password with <code>gxb-operator setup</code>.</p>
</div>
</div>
</section>

<div id="app-view" hidden>
<header class="navbar navbar-expand-md d-print-none">
<div class="container-xl">
<div class="navbar-brand">GXB operator</div>
<div class="navbar-nav flex-row ms-auto align-items-center gap-2">
<span id="backend-state" class="nav-link" role="status"></span>
<div id="account-menu" class="dropdown">
<button id="account-button" type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle" aria-haspopup="menu" aria-expanded="false">Account</button>
<div id="account-dropdown" class="dropdown-menu dropdown-menu-end" role="menu" hidden>
<button id="change-password-button" type="button" class="dropdown-item" role="menuitem">Change password</button>
<button id="logout-button" type="button" class="dropdown-item" role="menuitem">Log out</button>
<div class="dropdown-divider"></div>
<fieldset class="px-3 py-2" role="group" aria-label="Theme">
<legend class="form-label mb-2">Theme</legend>
<label class="form-check"><input class="form-check-input" type="radio" name="theme-choice" value="auto"><span class="form-check-label">Auto (system)</span></label>
<label class="form-check"><input class="form-check-input" type="radio" name="theme-choice" value="light"><span class="form-check-label">Light</span></label>
<label class="form-check"><input class="form-check-input" type="radio" name="theme-choice" value="dark"><span class="form-check-label">Dark</span></label>
</fieldset>
</div>
</div>
</div>
</div>
</header>
<div class="page-wrapper">
<div class="page-body">
<div class="container-xl">
<div class="row g-3">
<aside class="col-md-3 col-lg-2">
<nav id="nav" class="nav nav-pills flex-column" aria-label="Sections"></nav>
</aside>
<main class="col-md-9 col-lg-10">
<p id="backend-error" class="status" role="status"></p>
<div id="page-view"></div>
</main>
</div>
</div>
</div>
</div>
</div>

<div id="password-modal" class="account-modal" hidden role="dialog" aria-modal="true" aria-labelledby="password-modal-title">
<div class="card card-md">
<div class="card-body">
<h2 id="password-modal-title" class="card-title">Change password</h2>
<form id="password-form">
<label class="form-label" for="current-password">Current password</label>
<input id="current-password" type="password" class="form-control" autocomplete="current-password" required>
<label class="form-label" for="new-password">New password</label>
<input id="new-password" type="password" class="form-control" autocomplete="new-password" required>
<label class="form-label" for="repeat-password">Repeat new password</label>
<input id="repeat-password" type="password" class="form-control" autocomplete="new-password" required>
<p id="password-status" class="status mt-2" role="status"></p>
<div class="d-flex gap-2 mt-3">
<button id="password-save" type="submit" class="btn btn-primary">Change password</button>
<button id="password-cancel" type="button" class="btn btn-link">Cancel</button>
</div>
</form>
</div>
</div>
</div>
</body>
</html>
