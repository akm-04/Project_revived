[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
version_table = gxb_alembic_version

# Runtime URLs are never stored here. migrations/env.py requires
# GXB_DATABASE_URL (or GXB_TEST_DATABASE_URL for disposable test databases).
sqlalchemy.url = postgresql+psycopg://gxb_app@127.0.0.1/gxb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
