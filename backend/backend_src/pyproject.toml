[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gxb-eol-backend"
version = "0.62.0"
description = "Girls X Battle EOL private backend"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
markers = [
  "postgresql: requires an explicitly configured disposable PostgreSQL test database",
]
