upstream gxb_http { server unix:/run/gxb/http.sock; keepalive 32; }

server {
    listen 5000;
    listen 9000;
    client_max_body_size 16m;
    location /res/ { alias /opt/gxb/backend/local_assets/res/; try_files $uri =404; }
    location / {
        if (-f /run/gxb/maintenance) { return 503; }
        proxy_pass http://gxb_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
